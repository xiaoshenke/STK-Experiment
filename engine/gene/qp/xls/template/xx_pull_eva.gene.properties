basic_eva=npull:min=1.2

# 当前切片生成包括以下核心kv
# title
# if: 条件语句
# qianyan
# tips: 用于打印一些静态信息
# eva: 用于计算一些信息 主要用于打印一些动态信息
# *qps: 核心组件 用于生成切片
# *on_result: 在计算获得了切片以后 如果指定了计算的func 那么再进行一次过滤 默认可以为空

start=09:33:00

if=xx->pull_or_higher*filter:min=5
if_err_msg=不满足最小数据量的话 没必要计算了

on_result=

qianyan=以实时pull为主要图形的切片生成

# 核心组件
# 1,直接指定
# 2,通过一个if then条件语句判定
qps_all={00:00:00,23:59:59}if xx->pull_or_higher*filter:min=5:max=20 \
then xx->pull_or_higher,\
if xx->pull_or_higher*filter:max=4 then break,\
