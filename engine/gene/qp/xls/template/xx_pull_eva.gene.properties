if xx->xyz*trd_minus:min=5*filter:max=25 then xx->xyz*trd_minus:min=5,\
zhushi:股价走出了反转,\
if xx->xyz*upbound:min=0.7*up0*filter:max=25 then xx->xyz*upbound:min=0.7*up0,\
