# 提供一个同时跟踪pool和qpc的实现 
# 这个其实才是最真实的 毕竟我盘前并不能预判 我是应该选择题材 还是选择版块池

# 实现参考@xx_only_qpc_buyer.hand.properties @xx_tracing_alot_pool.hand.properties

enable_bkzj_df=1
open_index=yy
start=09:15:00 

if=exist_hand_pool and exist_hand_qpc

# 必须指定qpc 否则无法通过if条件
qpc=
# 同时也必须指定pool 否则无法通过if条件
pool=

qianyan=提供一个同时跟踪pool和qpc的实现

eva0_jj={09:20:00,09:45:00}

flush_jj={09:20:00,09:45:00}zz->zao_hq,\
yy->if2:eva-rrup:min=2,\
yy->if2:eva-rrup:min=3

# 允许的话 走一下pool的更复杂的计算
flush_pool_jj={09:20:00,09:45:00}if get_candi:yy*filter:min=4 \
and not yy==can_flush_alot_pool.if then break,\
zhushi:如果条件合适的话 对版块池走一下zao hq计算,\
yy->zao_hq


