attack指标: sh/eva/cli.sh xx tx:attack --time_str $time_str --open 1 #\
计算up2: sh/codes/qp/gene/by_xls.sh xx up2_eva --time_str $time_str --action download #\
计算co2: sh/codes/qp/gene/by_xls.sh xx co2_eva --time_str $time_str --action download #\
计算attack: sh/codes/qp/gene/by_xls.sh xx attack_eva --time_str $time_str --action download #\
\n\
可以计算一下日间对比数据: python realtime/stage/cli.py get xx trend3.cross --mode zao1 #\
python realtime/stage/cli.py get xx eva_size:eva_type=tx:attack.cross --mode zao1 #\
\n\
\n\


