qianyan=本文给出一个未知股票池(盘前没有过多的分析)的默认实现 #\
\n\
\n\
对股票池做版块池分析: #\
盘前: sh/codes/qp/gene/by_xls.sh xx split_pool #\
实盘: sh/codes/qp/gene/by_xls.sh xx*eva:rup2 split_pool #\
找到版块池后继续分析: sh/tips/run_xls_template.sh abc analyze_pool_cross_zijin #\
\n\
\n\
[日间]#\
显然图形分析是最重要的: sh/codes/qp/gene/by_xls.sh xx redu_detail #\
(可以在这个分析的结果上 进行2次选择) #\
资金分析: sh/tips/run_xls_template.sh xx analyze_xls_cross_zijin #\
\n\
\n\
[日内]#\
在市场中的地位: sh/tips/run_xls_template.sh xx xls_diwei_default #\
实时锚定: sh/template/run_xls_template.sh xx xls_maoding #\
直接根据up2数据进行计算: sh/codes/qp/gene/by_xls.sh xx up2_eva --action download #\
(up2的数据的多少 也能看出来版块的实际强度 可以在这个基础上 选择其它的应对方案) #\
sh/codes/qp/gene/by_xls.sh xx co2_eva --action download #\
计算进攻attack数据: sh/codes/qp/gene/by_xls.sh xx attack_eva --action download #\
\n\
根据ggzj数据进行判断: sh/tips/run_xls_template.sh xx analyze_xls_by_ggzj2 #\
\n\
\n\
跑一下对应的plan(比较有效): sh/tips/run_xls_template.sh xx make_plan_unknown_codes #\
\n\
\n\
\n\

