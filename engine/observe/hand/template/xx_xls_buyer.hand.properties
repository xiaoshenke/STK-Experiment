qianyan=本文给出板块买点的默认实现 #\
正因为是这个定位 所以本文的内容都主要专注于买点(为了内容的干净 阉割了监控和分析的部分 也是无奈) #\
\n\
\n\
买点最重要的 无非是: 切片挖掘+切片跟踪 #\
[切片挖掘]: 无非是盘前看好的切片+实盘临盘加入aa*eva:bb(或者aa*某个题材) \
结合本文的qpc=配置 基本能够满足 #\
[切片跟踪]: 本hand架构提供了比较灵活的跟踪 周期调度+手工刷新+文件监听 也基本能够满足 #\
(综上 从能力的角度 本hand已经足够 现在的问题就是买点的质量是不是足够好) #\
\n\
\n\
对买点来说 配置好题材的切片是非常重要的(甚至是最重要的): sh/qpc/write_key.sh xx list:abc,xyz #\
添加一项: sh/qpc/add_to_key.sh xx bb #\
\n\
\n\
一些可能会用到的买点命令: #\
sh/codes/qp/gene/by_xls.sh xx*eva:up2 split_pool --time_str $time_str #\
sh/codes/qp/gene/by_xls.sh xx*eva:up2 huoyue_fenbu --time_str $time_str #\
sh/codes/qp/gene/by_xls.sh xx*10cm pull_eva2 --time_str $time_str #\
\n\
\n\

