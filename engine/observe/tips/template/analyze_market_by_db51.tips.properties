实现参考@analyze_market_by_db31.tips.properties#\
\n\
和db31相比 db51能够找到更远交易日的强势题材 因此其实数据会比db31更好 \
因此如果可以的话 尽量选择db51而不是db31#\
\n\
\n\
db51的几个作用:#\
1 判断超短票(一般是小票)是否强势 可以叠加市场的红盘数据进行对比#\
2 用作锚定+筛选版块池 #\
\n\
\n\
\n\
直接根据前排数据计算版块池(正常情况下可以无脑计算的 只不过可能有些耗时被我写到了这里):#\
sh/eva/cli.sh db51 up7 --back pool_and_top#\
sh/eva/cli.sh db51 upstp --back pool_and_top#\
