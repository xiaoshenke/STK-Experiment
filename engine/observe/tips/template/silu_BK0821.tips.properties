MSCI+BK1717: 题材股 #\
MSCI+BK1633: 前日高震幅 #\
MSCI+xls:ggzj 叠加ggzj 具备一定关注度的 #\
MSCI+tx:huoli 获利盘 #\
MSCI+no30100 一定的辨识度 #\
MSCI+no30000 基础的xt图形 #\
(当然 因为MSCI是大票 因此实际的日内图形数据会更重要) #\
