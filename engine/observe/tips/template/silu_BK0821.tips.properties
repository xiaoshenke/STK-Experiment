对MSCI这种大票来说 有2种通用的策略: #\
1 市场走阳线时 买点数量会相比平常暴涨 #\
2 正常的市场 作为一些稀有的保守的图形买点 或者近期有一定持续的市场关注度的票\
(这个其实在混沌的行情 或者自己选择保守的策略时 都是比较好的选择)#\
\n\
\n\
\n\
