no=91321

qianyan=从各个角度判断题材是否轮动/轮动程度强度(支持全时区)#\
(会给出很多细致的数据 比如no30401这种细节图形数据)#\
\n\
注意:版块和版块头部数据不一定是一致的 完全可能出现"全题材的主力数据\
是负了很多 但是前排的头部数据却很好的情况 此时以全题材的数据为准" #\
