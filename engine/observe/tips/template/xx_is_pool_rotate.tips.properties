get_candi:xx*stage:zijin:mode=cross,\
zhushi:最基础的前日收盘数据 如果数据非常好 那么也(必然不是)轮动数据,\
print_fenge,\
print:注意:ggzj的数据只代表在前日的市场中的数据 不代表更长周期的数据 因此准度不如上面,\
xls:ggzj:limit=40->get_codes,back=append_xls2:xx,\
zhushi:前日的ggzj的前排数据 这个数据太好的话 也必然不是轮动数据

# xx->stage:zijin,\
# xx::xls:ggzj:limit=60*not:xls:ggzj:limit=150.bf->size:len=1,\
# zhushi:新进入到xls:ggzj前60的数据
# if not new:BK1633*filter:min=1 then break,\
# zhushi:如果更新动态版块池BK1633失败 那么终止计算,\
# if new:BK1633*filter:min=1 then xx::BK1633->stage:trends_sum:len=5:sort=sum,\
