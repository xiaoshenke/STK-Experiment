xx::10cm*trd:min=6->size:len=4:sort=size,\
zhushi:10cm的trd>6的数据 也是直观的资金获利数据,\
xx::10cm*tx:huoli->size:len=1,\
zhushi:tx:huoli是计算的3个交易日的数据 因此是一个偏短期的数据,\
print_fenge,\
print:下面是zijin相关的数据 代表在前一日市场中的数据 准度不如上面的高,\
xx::BK1633->stage:trends_sum:len=5:sort=sum,\
zhushi:BK1633包含了一些潜伏资金 比xls:ggzj准度高 因此排序在第一位,\
xx::xls:ggzj->stage:trends_sum:len=3:sort=sum,\
zhushi:首先如果个股数量很多 就代表资金介入很深了 其次trends-sum数据很好的话 那么也不是轮动,\
xx::xls:ggzj:limit=40->size:len=3:sort=sum,\
